name: 'Docker Image Name'
description: 'Gera o nome da imagem Docker removendo o prefixo "docker-" do nome do repositório'

inputs:
  dockerhub_user:
    description: 'Usuário do Docker Hub (ex: secrets.DOCKERHUB_USER)'
    required: true
  repo_name:
    description: 'Opcional: nome do repositório (ex: github.event.repository.name). Se não fornecido, usa GITHUB_REPOSITORY.'
    required: false

outputs:
  name:
    description: 'Nome da imagem gerada (ex: usuario/repositorio)'
    value: ${{ steps.get.outputs.name }}

runs:
  using: "composite"
  steps:
    - name: Get image name
      id: get
      shell: bash
      run: |
        DOCKERHUB_USER="${{ inputs.dockerhub_user }}"
        REPO_NAME="${{ inputs.repo_name }}"

        # Se não foi passado, pega do contexto do runner (owner/repo -> pega só o repo)
        if [[ -z "$REPO_NAME" ]]; then
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
        fi

        CLEAN_NAME="${REPO_NAME#docker-}"
        IMAGE_NAME="${DOCKERHUB_USER}/${CLEAN_NAME}"
        echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"